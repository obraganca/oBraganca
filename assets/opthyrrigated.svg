<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="optHyrrigated: ILS+RVND atinge o ótimo em soja, milho e algodão e fica a 0,08% do ótimo na cana-de-açúcar">
  <!-- Paleta do currículo (index.html): paper, ink, muted, accent (laranja queimado), petrol (verde-petróleo) -->
  <style>
    .bg{fill:#f5f0e6} .ink{fill:#1d1b18} .ink2{fill:#47433c} .muted{fill:#7a7366} .rule{stroke:#dcd3c2} .track{fill:#ede6d7}
    .acc{fill:#b4501c} .pet{fill:#1d6b67} .accSoft{fill:#b4501c;fill-opacity:.12} .petSoft{fill:#1d6b67;fill-opacity:.12}
    @media (prefers-color-scheme: dark){
      .bg{fill:#121518} .ink{fill:#ebe5d9} .ink2{fill:#c2bbad} .muted{fill:#8c867a} .rule{stroke:#2a3036} .track{fill:#181c20}
      .acc{fill:#e2804b} .pet{fill:#55b5ab} .accSoft{fill:#e2804b;fill-opacity:.14} .petSoft{fill:#55b5ab;fill-opacity:.13}
    }
    text{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.bar{animation:none}}
  </style>
  <rect class="bg" width="1000" height="250" rx="16"/>
  <rect x=".5" y=".5" width="999" height="249" rx="16" fill="none" class="rule"/>

  <!-- identidade do projeto -->
  <rect x="32" y="30" width="148" height="24" rx="12" class="petSoft"/>
  <text x="44" y="46" font-size="12" class="pet">IC · GOAL / UFOP</text>
  <text x="32" y="100" class="serif acc" font-size="42">optHyrrigated</text>
  <text x="32" y="128" class="ink2" font-size="13.5">ILS + RVND · irrigação por pivô central</text>
  <text x="32" y="160" class="muted" font-size="12">Lookahead · 4 vizinhanças do domínio</text>
  <text x="32" y="180" class="muted" font-size="12">viabilidade de cada movimento em O(1)</text>
  <rect x="32" y="198" width="168" height="26" rx="6" class="accSoft"/>
  <text x="44" y="215" font-size="12" class="acc">artigo · LVIII SBPO 2026</text>

  <line x1="400" y1="30" x2="400" y2="220" class="rule"/>

  <!-- cabeçalho -->
  <text x="430" y="46" class="muted" font-size="11">INSTÂNCIA</text>
  <text x="590" y="46" class="muted" font-size="11" text-anchor="end">DIAS</text>
  <text x="612" y="46" class="muted" font-size="11">GAP</text>
  <text x="700" y="46" class="muted" font-size="11">TEMPO MÉDIO (escala log)</text>

  <!-- linhas: instância · dias · gap · tempo -->
  <g font-size="13">
    <text x="430" y="86" class="ink">Soja</text>
    <text x="590" y="86" class="ink" text-anchor="end">120</text>
    <rect x="612" y="70" width="66" height="22" rx="11" class="petSoft"/><text x="621" y="86" font-size="12" class="pet">0,00%</text>
    <rect x="700" y="72" width="240" height="18" rx="9" class="track"/>
    <rect x="700" y="72" width="99" height="18" rx="9" class="pet bar"/>
    <text x="808" y="86" class="muted" font-size="12">7,9 s</text>

    <text x="430" y="128" class="ink">Milho</text>
    <text x="590" y="128" class="ink" text-anchor="end">140</text>
    <rect x="612" y="112" width="66" height="22" rx="11" class="petSoft"/><text x="621" y="128" font-size="12" class="pet">0,00%</text>
    <rect x="700" y="114" width="240" height="18" rx="9" class="track"/>
    <rect x="700" y="114" width="96" height="18" rx="9" class="pet bar" style="animation-delay:.12s"/>
    <text x="805" y="128" class="muted" font-size="12">7,4 s</text>

    <text x="430" y="170" class="ink">Algodão</text>
    <text x="590" y="170" class="ink" text-anchor="end">180</text>
    <rect x="612" y="154" width="66" height="22" rx="11" class="petSoft"/><text x="621" y="170" font-size="12" class="pet">0,00%</text>
    <rect x="700" y="156" width="240" height="18" rx="9" class="track"/>
    <rect x="700" y="156" width="121" height="18" rx="9" class="pet bar" style="animation-delay:.24s"/>
    <text x="830" y="170" class="muted" font-size="12">13,6 s</text>

    <text x="430" y="212" class="ink">Cana-de-açúcar</text>
    <text x="590" y="212" class="ink" text-anchor="end">540</text>
    <rect x="612" y="196" width="66" height="22" rx="11" class="accSoft"/><text x="621" y="212" font-size="12" class="acc">0,08%</text>
    <rect x="700" y="198" width="240" height="18" rx="9" class="track"/>
    <rect x="700" y="198" width="230" height="18" rx="9" class="acc bar" style="animation-delay:.36s"/>
    <text x="940" y="235" class="muted" font-size="12" text-anchor="end">158,5 s</text>
  </g>
</svg>
